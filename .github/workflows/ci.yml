name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Launcher resolves the binary
        shell: bash
        run: |
          cargo build --locked
          exe=target/debug/discord-mcp; [ "$RUNNER_OS" = Windows ] && exe=$exe.exe
          set +e
          DISCORD_MCP_BINARY=$exe node npm/bin/discord-mcp.js < /dev/null
          code=$?
          [ "$code" = 78 ] || { echo "expected exit 78 (missing token), got $code"; exit 1; }
