name: Release

# Push a tag like v1.5.0. Builds the binaries, attaches them to the GitHub
# release, publishes the npm packages through trusted publishing (no token) and,
# when CARGO_REGISTRY_TOKEN is set, the crate.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: discord-mcp.exe }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, exe: discord-mcp }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, exe: discord-mcp }
          - { target: x86_64-apple-darwin, os: macos-latest, exe: discord-mcp }
          - { target: aarch64-apple-darwin, os: macos-latest, exe: discord-mcp }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match $version"; exit 1; }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p out/discord-mcp-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} out/discord-mcp-${{ matrix.target }}/
          cd out
          if [ "${{ runner.os }}" = Windows ]; then
            7z a discord-mcp-${{ matrix.target }}.zip ./discord-mcp-${{ matrix.target }}/* > /dev/null
          else
            tar czf discord-mcp-${{ matrix.target }}.tar.gz -C discord-mcp-${{ matrix.target }} ${{ matrix.exe }}
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: discord-mcp-${{ matrix.target }}
          path: out/discord-mcp-${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: archive-${{ matrix.target }}
          path: out/discord-mcp-${{ matrix.target }}.*

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives
      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          pattern: discord-mcp-*
          path: artifacts
      - run: node npm/platforms.mjs artifacts platforms
      # Trusted publishing (OIDC): no token secret. Each package needs this repo and
      # release.yml added as a trusted publisher on npmjs.com.
      - run: npm install -g npm@latest
      - name: Publish
        run: |
          publish() {
            name=$(node -p "require('./$1/package.json').name")
            version=$(node -p "require('./$1/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              (cd "$1" && npm publish --provenance --access public)
            fi
          }
          for dir in platforms/*/; do publish "${dir%/}"; done
          publish .

  crates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "CARGO_REGISTRY_TOKEN not set, skipping"; exit 0; fi
          cargo publish --locked
