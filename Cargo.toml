[package]
name = "el4cteo-discord-mcp"
version = "1.5.3"
edition = "2024"
rust-version = "1.90"
description = "MCP server that lets AI agents run a Discord bot: messages, DMs, channels, threads, roles, members, moderation, live events and bulk operations."
license = "MIT"
repository = "https://github.com/EL4CTEO/discord-mcp"
homepage = "https://github.com/EL4CTEO/discord-mcp#readme"
readme = "README.md"
keywords = ["mcp", "discord", "discord-bot", "ai-agent", "model-context-protocol"]
categories = ["command-line-utilities", "api-bindings"]
authors = ["EL4CTEO"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "discord-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.10", default-features = false, features = ["server", "base64", "transport-io"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "time", "sync", "signal", "fs", "net"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0.61", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream", "rustls", "http2"] }
twilight-gateway = { version = "0.18", default-features = false, features = ["rustls-platform-verifier", "zlib"] }
futures = "0.3"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
base64 = "0.23"
url = "2"
percent-encoding = "2"
dunce = "1"
bytes = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
